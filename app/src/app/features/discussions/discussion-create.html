<div class="min-h-screen bg-canvas">
  <app-header></app-header>

  <main class="mx-auto max-w-2xl px-4 py-8">
    <div class="bg-surface border border-line rounded-[var(--radius-card)] shadow-[var(--shadow-card)] p-6">
      <h1 class="text-lg font-semibold mb-6">Nueva discusión</h1>

      <form (submit)="onSubmit($event)" novalidate class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1" for="title">Título</label>
          <input
            id="title"
            type="text"
            [formField]="discussionForm.title"
            class="w-full rounded-md border border-line bg-surface px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
            placeholder="¿Cuál es el mejor traje de Iron Man?"
          />
          @if (discussionForm.title().touched() && discussionForm.title().invalid()) {
            <p class="mt-1 text-xs text-danger">{{ discussionForm.title().errors()[0].message }}</p>
          }
        </div>

        <div>
          <label class="block text-sm font-medium mb-1" for="content">Contenido</label>
          <textarea
            id="content"
            rows="6"
            [formField]="discussionForm.content"
            class="w-full rounded-md border border-line bg-surface px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent"
            placeholder="Escribe el contenido de la discusión..."
          ></textarea>
          @if (discussionForm.content().touched() && discussionForm.content().invalid()) {
            <p class="mt-1 text-xs text-danger">{{ discussionForm.content().errors()[0].message }}</p>
          }
        </div>

        <div class="flex justify-between items-center gap-2">
          <a routerLink="/discussions" class="rounded-md border border-line px-4 py-2 text-sm">Cancelar</a>
          <button
            type="submit"
            [disabled]="discussionForm().invalid() || submitting()"
            class="rounded-md bg-accent hover:bg-accent-strong text-ink px-4 py-2 text-sm font-medium disabled:opacity-50"
          >
            @if (submitting()) {
              Creando…
            } @else {
              Crear discusión
            }
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
