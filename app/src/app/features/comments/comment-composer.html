<form (submit)="onSubmit($event)" novalidate class="space-y-2">

  <div>
    <textarea
      [formField]="composerForm.content"
      [attr.placeholder]="placeholder"
      [attr.autofocus]="autofocus ? '' : null"
      rows="3"
      class="w-full rounded-md border border-line bg-surface px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-accent resize-none"
    ></textarea>
    @if (composerForm.content().touched() && composerForm.content().invalid()) {
      <p class="mt-1 text-xs text-danger">{{ composerForm.content().errors()[0].message }}</p>
    }
  </div>

  <div class="flex justify-between items-center gap-2">
    <div>
      @if (showVolver && !parentId) {
        <a routerLink="/discussions" class="text-sm text-muted hover:text-ink">← Volver</a>
      } @else if (parentId) {
        <button type="button" (click)="onCancel()" class="rounded-md border border-line px-3 py-1.5 text-sm">Cancelar</button>
      }
    </div>
    <button
      type="submit"
      [disabled]="composerForm().invalid() || submitting()"
      class="rounded-md bg-accent hover:bg-accent-strong text-ink px-4 py-1.5 text-sm font-medium disabled:opacity-50"
    >
      @if (submitting()) {
        Enviando…
      } @else if (parentId) {
        Responder
      } @else {
        Comentar
      }
    </button>
  </div>
</form>
