<header class="sticky top-0 z-10 bg-ink text-white border-b border-white/10">
  <div class="mx-auto max-w-4xl px-4 py-3 flex items-center justify-between">
    <a routerLink="/discussions" class="text-lg font-semibold tracking-tight text-white">Discusiones</a>
    <div class="relative">
      <button
        type="button"
        (click)="toggleMenu()"
        class="flex items-center gap-2 rounded-md border border-white/20 bg-white/10 px-3 py-1.5 text-sm text-white hover:bg-white/15"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen()"
      >
        <span class="hidden sm:inline">{{ auth.user()?.username }}</span>
        <span class="sm:hidden">{{ (auth.user()?.username ?? '').slice(0, 2) | uppercase }}</span>
        <svg class="h-4 w-4 text-white/70" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd" />
        </svg>
      </button>

      @if (menuOpen()) {
        <div
          class="absolute right-0 mt-2 w-44 rounded-md border border-line bg-surface shadow-[var(--shadow-card)] py-1"
          role="menu"
        >
          <a
            routerLink="/settings"
            (click)="closeMenu()"
            role="menuitem"
            class="block px-3 py-2 text-sm hover:bg-canvas"
          >
            Configuración
          </a>
          <button
            type="button"
            (click)="logout()"
            role="menuitem"
            class="block w-full text-left px-3 py-2 text-sm hover:bg-canvas"
          >
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
