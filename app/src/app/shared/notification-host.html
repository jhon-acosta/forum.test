<div
  class="fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"
  aria-live="assertive"
  aria-atomic="true"
>
  @for (n of notificationService.notifications(); track n.id) {
    <div
      role="alert"
      class="pointer-events-auto w-full max-w-md rounded-md border bg-surface shadow-[var(--shadow-card)] px-4 py-3 flex gap-3 items-start"
      [class.border-green-200]="n.type === 'success'"
      [class.border-red-200]="n.type === 'error'"
      [class.border-blue-200]="n.type === 'info'"
      [class.border-amber-200]="n.type === 'warning'"
    >
      <div class="mt-0.5">
        @if (n.type === 'success') {
          <svg class="h-5 w-5 text-green-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.062l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
          </svg>
        } @else if (n.type === 'error') {
          <svg class="h-5 w-5 text-red-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
          </svg>
        } @else if (n.type === 'warning') {
          <svg class="h-5 w-5 text-amber-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625l6.28-10.875zM10 5a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 0110 5zm0 9a1 1 0 100 2 1 1 0 000-2z" clip-rule="evenodd" />
          </svg>
        } @else {
          <svg class="h-5 w-5 text-blue-600" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a.75.75 0 000 1.5h.253a.25.25 0 01.25.25v2.5a.75.75 0 001.5 0v-2.5A1.75 1.75 0 009.253 9H9z" clip-rule="evenodd" />
          </svg>
        }
      </div>
      <div class="flex-1">
        <p class="text-sm font-medium text-ink">{{ n.message }}</p>
        @if (n.description) {
          <p class="text-xs text-muted mt-0.5">{{ n.description }}</p>
        }
      </div>
      <button
        type="button"
        (click)="notificationService.dismiss(n.id)"
        class="text-muted hover:text-ink -mt-1 -mr-1 p-1"
        aria-label="Cerrar"
      >
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M6.28 5.22a.75.75 0 00-1.06 1.06L8.94 10l-3.72 3.72a.75.75 0 101.06 1.06L10 11.06l3.72 3.72a.75.75 0 101.06-1.06L11.06 10l3.72-3.72a.75.75 0 00-1.06-1.06L10 8.94 6.28 5.22z" /></svg>
      </button>
    </div>
  }
</div>
